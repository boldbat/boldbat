name: 🎮 Generate Quantum Pacman Animation

on:
  schedule: # execute every 6 hours for more frequent updates
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🎯 Checkout repository
        uses: actions/checkout@v4

      - name: 🎮 Generate enhanced pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: 🌟 Generate snake contribution graph (backup)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 🚀 Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🎮 Update Quantum Pacman & Snake animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}